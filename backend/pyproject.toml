[project]
name = "researchmind-backend"
version = "0.1.0"
description = "ResearchMind AI — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
]
video = [
    "av>=18.1.0,<19",
    "faster-whisper>=1.2.1",
    "nltk>=3.9",
    "numpy>=2.4.6",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "sentence-transformers>=6.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
